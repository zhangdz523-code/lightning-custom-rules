name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: ./gradlew build --no-daemon

      - name: Find APK files
        run: |
          echo "=== APKs ==="
          find app/build/outputs -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "No APKs found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
