name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758

      - name: Accept SDK licenses
        run: |
          echo "android-sdk-license-24333f8a63b68ba5e66633e06230f174b7f5465d" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license

      - name: Install SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;36.1.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info
        env:
          GRADLE_OPTS: -Xmx4g

      - name: Find APK files
        run: |
          echo "=== Searching for APKs ==="
          find app/build/outputs -name "*.apk" -exec ls -lh {} \; || echo "No APKs found"
          find app/build -name "*.apk" 2>/dev/null | head -10

      - name: Upload APK (Lightning Lite)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-lite-debug.apk
          path: |
            app/build/outputs/apk/lightningLite/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload APK (Lightning Plus)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-plus-debug.apk
          path: app/build/outputs/apk/lightningPlus/debug/*.apk
          if-no-files-found: ignore
