name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Show pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/
          echo "---"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools"
          which sdkmanager 2>/dev/null || find $ANDROID_HOME -name "sdkmanager" 2>/dev/null

      - name: Install SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.1.0" 2>&1

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx4g

      - name: Find APK files
        run: |
          echo "=== APK output directory ==="
          find app/build/outputs -type f -name "*.apk" 2>/dev/null | head -20
          echo "=== APK sizes ==="
          find app/build/outputs -name "*.apk" -exec ls -lh {} \; 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
