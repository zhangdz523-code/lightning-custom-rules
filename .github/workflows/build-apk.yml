name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: |
          yes | "$ANDROID_HOME/sdkmanager" --licenses || true

      - name: Install required SDK components
        run: |
          "$ANDROID_HOME/sdkmanager" "platform-tools" "platforms;android-37" "build-tools;36.1.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload Lightning Lite APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-lite-debug.apk
          path: app/build/outputs/apk/lightningLite/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Lightning Plus APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-plus-debug.apk
          path: app/build/outputs/apk/lightningPlus/debug/*.apk
          if-no-files-found: ignore

      - name: List build outputs
        run: |
          echo "=== APK outputs ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
